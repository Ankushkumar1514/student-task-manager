<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="app-header">
        <div>
          <h1>Student Task Manager</h1>
          <p class="subtitle">Keep track of assignments, exams, and deadlines in one place.</p>
        </div>
        <div class="stats" id="task-stats">0 pending · 0 done</div>
      </header>

      <!-- Add Task Form -->
      <section class="card">
        <h2>Add New Task</h2>
        <form id="task-form" class="task-form" novalidate>
          <div class="form-group full-width">
            <label for="title">Task Title *</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="e.g., Finish Calculus Problem Set 4"
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">Subject / Course *</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="e.g., Mathematics"
              required
            />
          </div>

          <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" name="dueDate" />
          </div>

          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-actions full-width">
            <button type="submit" class="btn-primary">Add Task</button>
          </div>

          <p id="form-error" class="error-message full-width" hidden></p>
        </form>
      </section>

      <!-- Filter & Task List -->
      <section class="card">
        <div class="list-header">
          <h2>Your Tasks</h2>
          <div class="filters">
            <div class="filter-tabs" role="group" aria-label="Filter by status">
              <button type="button" class="filter-btn active" data-filter="all">All</button>
              <button type="button" class="filter-btn" data-filter="pending">Pending</button>
              <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <select id="subject-filter" aria-label="Filter by subject">
              <option value="all">All Subjects</option>
            </select>
          </div>
        </div>

        <ul id="task-list" class="task-list">
          <li class="empty-state">Loading tasks...</li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
